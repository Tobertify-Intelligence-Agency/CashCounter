name: Android Release (AAB)

# Builds a signed Android App Bundle (.aab) that targets API 36 (Android 16),
# satisfying the Google Play target-API requirement (deadline 2026-08-31).
#
# The build targets net10.0-android, which defaults to API 36 in .NET 10 — so
# the produced AAB reports targetSdkVersion 36 automatically.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of cashcount.keystore
#                             create with:  base64 -w0 cashcount.keystore   (Linux)
#                                           certutil -encode cashcount.keystore out.txt   (Windows, then strip header/footer)
#   CASHCOUNT_KEYSTORE_PASS   the keystore/key password (same value used by the csproj)
#
# Trigger it manually (Actions tab -> Run workflow) or by pushing a tag like v1.0.6.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Ensure Android SDK Platform 36 is installed
        run: |
          set -e
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/cashcount.keystore"

      - name: Restore
        # Build only the Android head. On a Linux runner the iOS/macCatalyst
        # workload packs are absent, so restoring every TFM fails (NETSDK1178).
        # AndroidOnly is read only by CashCount.Maui.csproj, so referenced
        # projects (CashCount.Shared -> net10.0) are unaffected.
        run: dotnet restore CashCount.Maui/CashCount.Maui.csproj -p:AndroidOnly=true

      - name: Publish signed AAB (Release, API 36)
        env:
          CASHCOUNT_KEYSTORE_PASS: ${{ secrets.CASHCOUNT_KEYSTORE_PASS }}
        run: |
          if [ -z "$CASHCOUNT_KEYSTORE_PASS" ]; then
            echo "::error::Secret CASHCOUNT_KEYSTORE_PASS is not set."
            exit 1
          fi
          dotnet publish CashCount.Maui/CashCount.Maui.csproj \
            -c Release \
            -f net10.0-android \
            -p:AndroidOnly=true \
            -p:AndroidSigningKeyStore="${GITHUB_WORKSPACE}/cashcount.keystore" \
            -p:AndroidPackageFormat=aab

      - name: Collect artifact
        run: |
          set -e
          mkdir -p artifacts
          echo "All .aab files produced:"
          find CashCount.Maui/bin/Release -name '*.aab' -print
          # Prefer the signed bundle (<package-id>-Signed.aab).
          found=$(find CashCount.Maui/bin/Release -name '*-Signed.aab' | head -n1)
          if [ -z "$found" ]; then
            echo "::error::No *-Signed.aab found — signing did not run. See the file list above."
            exit 1
          fi
          cp "$found" artifacts/
          echo "Packaged: $found"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: cashcount-android-aab
          path: artifacts/*.aab
          if-no-files-found: error
          retention-days: 14
